name: Build and tests

on:
  push:
    branches:
      - implementaçaofinal
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar CMake
        run: cmake -S . -B build
      - name: Compilar
        run: cmake --build build --parallel 2
      - name: Testar uma partida completa
        run: bash tests/smoke.sh
      - name: Testar carregamento dos arquivos de desenvolvimento
        run: printf '0\n' | ./build/dado_burger dados/pedidos.txt dados/historico.txt > /dev/null
